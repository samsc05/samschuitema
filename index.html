
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: monospace;
      text-align: center;
    }

    h1 { padding: 16px; }

    .scene {
      position: relative;
      width: min(100%, 1000px);
      margin: auto;
    }

    .scene img {
      display: block;
      width: 100%;
      image-rendering: pixelated;
    }

    .hotspot {
      position: absolute;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border: 2px solid #ffe88a;
      border-radius: 50%;
      background: #ffe88a22;
      color: #fff3a6;
      font-size: 28px;
      cursor: pointer;
      animation: glow 2s infinite ease-in-out;
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 5px #ffe88a;
      }
      50% {
        box-shadow: 0 0 22px 8px #ffe88a88;
      }
    }

    .info {
      display: none;
      position: fixed;
      inset: 0;
      background: #000a;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .panel {
      background: #202c43;
      border: 2px solid #ffe88a;
      padding: 24px;
      max-width: 360px;
      line-height: 1.6;
    }

    .panel button {
      padding: 10px 18px;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .hotspot { animation: none; }
    }
  </style>
</head>
<body>

  <div class="scene">
    <img src="SamInAmsterdam.png" alt="Pixel-art van Amsterdam">
    <button class="hotspot" aria-label="Ontdek de fiets"
      onclick="document.getElementById('info').style.display='flex'">
      🚲
    </button>
  </div>

  <div class="info" id="info" role="dialog"
       aria-modal="true" aria-labelledby="titel">
    <div class="panel">
      <h2 id="titel">De fiets van Utrecht</h2>
      <p>Ontdek de verhalen achter de fietsen en grachten
        van Utrecht. Vervang deze tekst door je eigen verhaal!</p>
      <button onclick="document.getElementById('info').style.display='none'">
        Terug naar de afbeelding
      </button>
    </div>
  </div>
</body>
</html>


<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: monospace;
      text-align: center;
      overflow: hidden;
    }

    h1 { padding: 16px; }

    .scene {
      position: relative;
      width: 100vw;
      margin: 0;
    }

    .scene img {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <div class="scene">
    <img src="SamInAmsterdam.png" alt="Pixel-art van Amsterdam">
  </div>

</body>
</html>
